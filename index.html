<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Découvrez tous les Pokémon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="conteneur">
        <!-- En-tête -->
        <header class="entete">
            <div class="haut-entete">
                <h1 class="titre">
                    <span class="icone-pokeball">⚪</span>
                    Pokédex
                </h1>
                <button id="basculeurTheme" class="basculeur-theme" aria-label="Changer de thème">
                    <span class="icone-theme soleil">☀️</span>
                    <span class="icone-theme lune">🌙</span>
                </button>
            </div>
            <p class="sous-titre">Explorez l'univers des Pokémon</p>
        </header>

        <!-- Barre de recherche -->
        <div class="conteneur-recherche">
            <input type="text" id="champRecherche" class="champ-recherche" placeholder="Rechercher un Pokémon...">
            <button id="boutonRecherche" class="bouton-recherche">🔍</button>
        </div>

        <!-- Options de filtre -->
        <div class="conteneur-filtre">
            <select id="filtreType" class="selecteur-filtre">
                <option value="">Tous les types</option>
                <option value="favoris">⭐ Favoris</option>
                <option value="normal">Normal</option>
                <option value="fire">Feu</option>
                <option value="water">Eau</option>
                <option value="electric">Électrique</option>
                <option value="grass">Plante</option>
                <option value="ice">Glace</option>
                <option value="fighting">Combat</option>
                <option value="poison">Poison</option>
                <option value="ground">Sol</option>
                <option value="flying">Vol</option>
                <option value="psychic">Psy</option>
                <option value="bug">Insecte</option>
                <option value="rock">Roche</option>
                <option value="ghost">Spectre</option>
                <option value="dragon">Dragon</option>
                <option value="dark">Ténèbres</option>
                <option value="steel">Acier</option>
                <option value="fairy">Fée</option>
            </select>
            
            <button id="boutonAfficherEquipe" class="bouton-equipe">
                👥 Mon Équipe (<span id="compteurEquipe">0</span>/6)
            </button>
            
            <button id="boutonCreerPokemon" class="bouton-creer-pokemon">
                ✨ Créer mon Pokémon
            </button>
        </div>

        <!-- Indicateur de chargement -->
        <div id="chargement" class="chargement">
            <div class="spinner"></div>
            <p>Chargement des Pokémon...</p>
        </div>

        <!-- Grille Pokémon -->
        <div id="grillePokemon" class="grille-pokemon"></div>

        <!-- Bouton charger plus -->
        <div class="conteneur-charger-plus">
            <button id="boutonChargerPlus" class="bouton-charger-plus">Charger plus de Pokémon</button>
        </div>
    </div>

    <!-- Modale pour les détails Pokémon -->
    <div id="modale" class="modale">
        <div class="contenu-modale">
            <span class="bouton-fermer">&times;</span>
            <div id="corpsModale" class="corps-modale">
                <!-- Les détails du Pokémon seront insérés ici -->
            </div>
        </div>
    </div>

    <!-- Panneau de l'équipe -->
    <aside id="panneauEquipe" class="panneau-equipe">
        <div class="entete-panneau">
            <h2>Mon Équipe Pokémon</h2>
            <button id="boutonFermerPanneau" class="bouton-fermer-panneau">✕</button>
        </div>
        <div id="conteneurEquipe" class="conteneur-equipe">
            <p class="message-equipe-vide">Aucun Pokémon dans l'équipe</p>
        </div>
    </aside>

    <!-- Overlay pour le panneau -->
    <div id="overlayPanneau" class="overlay-panneau"></div>

    <!-- Modale de création de Pokémon -->
    <div id="modaleCreation" class="modale-creation">
        <div class="contenu-modale-creation">
            <span class="bouton-fermer-creation">&times;</span>
            <h2 class="titre-modale-creation">✨ Créer mon Pokémon personnalisé</h2>
            
            <form id="formulaireCreation" class="formulaire-creation">
                <div class="groupe-champ">
                    <label for="nomPokemon" class="etiquette-champ">Nom du Pokémon *</label>
                    <input 
                        type="text" 
                        id="nomPokemon" 
                        name="nomPokemon" 
                        class="champ-saisie"
                        placeholder="Ex: Dracofeu"
                        required
                        minlength="3"
                        maxlength="20"
                    >
                    <span class="message-erreur" id="erreurNom"></span>
                </div>

                <div class="groupe-champ">
                    <label for="typePokemon" class="etiquette-champ">Type principal *</label>
                    <select id="typePokemon" name="typePokemon" class="champ-saisie" required>
                        <option value="">-- Sélectionner un type --</option>
                        <option value="normal">Normal</option>
                        <option value="fire">Feu</option>
                        <option value="water">Eau</option>
                        <option value="electric">Électrique</option>
                        <option value="grass">Plante</option>
                        <option value="ice">Glace</option>
                        <option value="fighting">Combat</option>
                        <option value="poison">Poison</option>
                        <option value="ground">Sol</option>
                        <option value="flying">Vol</option>
                        <option value="psychic">Psy</option>
                        <option value="bug">Insecte</option>
                        <option value="rock">Roche</option>
                        <option value="ghost">Spectre</option>
                        <option value="dragon">Dragon</option>
                        <option value="dark">Ténèbres</option>
                        <option value="steel">Acier</option>
                        <option value="fairy">Fée</option>
                    </select>
                    <span class="message-erreur" id="erreurType"></span>
                </div>

                <div class="groupe-champ">
                    <label for="taillePokemon" class="etiquette-champ">Taille (en mètres) *</label>
                    <input 
                        type="number" 
                        id="taillePokemon" 
                        name="taillePokemon" 
                        class="champ-saisie"
                        placeholder="Ex: 1.7"
                        step="0.1"
                        min="0.1"
                        max="20"
                        required
                    >
                    <span class="message-erreur" id="erreurTaille"></span>
                </div>

                <div class="groupe-champ">
                    <label for="poidsPokemon" class="etiquette-champ">Poids (en kg) *</label>
                    <input 
                        type="number" 
                        id="poidsPokemon" 
                        name="poidsPokemon" 
                        class="champ-saisie"
                        placeholder="Ex: 90.5"
                        step="0.1"
                        min="0.1"
                        max="1000"
                        required
                    >
                    <span class="message-erreur" id="erreurPoids"></span>
                </div>

                <div class="groupe-champ">
                    <label for="descriptionPokemon" class="etiquette-champ">Description *</label>
                    <textarea 
                        id="descriptionPokemon" 
                        name="descriptionPokemon" 
                        class="champ-saisie champ-textarea"
                        placeholder="Décrivez votre Pokémon..."
                        required
                        minlength="20"
                        maxlength="200"
                        rows="4"
                    ></textarea>
                    <span class="compteur-caracteres"><span id="compteurCaracteres">0</span>/200</span>
                    <span class="message-erreur" id="erreurDescription"></span>
                </div>

                <div class="groupe-champ">
                    <label for="imagePokemon" class="etiquette-champ">Image du Pokémon</label>
                    <input 
                        type="file" 
                        id="imagePokemon" 
                        name="imagePokemon" 
                        class="champ-fichier"
                        accept="image/png, image/jpeg, image/jpg, image/gif, image/webp"
                    >
                    <div id="apercuImage" class="apercu-image" style="display: none;">
                        <img id="imageApercu" src="" alt="Aperçu" class="image-apercu">
                        <button type="button" id="boutonSupprimerImage" class="bouton-supprimer-image">✕</button>
                    </div>
                    <span class="message-erreur" id="erreurImage"></span>
                    <small class="aide-champ">Formats acceptés: PNG, JPG, GIF, WEBP (max 5 Mo)</small>
                </div>

                <div class="groupe-boutons">
                    <button type="submit" class="bouton-soumettre">
                        ✨ Créer mon Pokémon
                    </button>
                    <button type="button" id="boutonAnnuler" class="bouton-annuler">
                        Annuler
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
