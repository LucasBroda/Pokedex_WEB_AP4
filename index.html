<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Découvrez tous les Pokémon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="conteneur">
        <!-- En-tête -->
        <header class="entete">
            <div class="haut-entete">
                <h1 class="titre">
                    <span class="icone-pokeball">⚪</span>
                    Pokédex
                </h1>
                <button id="basculeurTheme" class="basculeur-theme" aria-label="Changer de thème">
                    <span class="icone-theme soleil">☀️</span>
                    <span class="icone-theme lune">🌙</span>
                </button>
            </div>
            <p class="sous-titre">Explorez l'univers des Pokémon</p>
        </header>

        <!-- Barre de recherche -->
        <div class="conteneur-recherche">
            <input type="text" id="champRecherche" class="champ-recherche" placeholder="Rechercher un Pokémon...">
            <button id="boutonRecherche" class="bouton-recherche">🔍</button>
        </div>

        <!-- Options de filtre -->
        <div class="conteneur-filtre">
            <select id="filtreType" class="selecteur-filtre">
                <option value="">Tous les types</option>
                <option value="favoris">⭐ Favoris</option>
                <option value="normal">Normal</option>
                <option value="fire">Feu</option>
                <option value="water">Eau</option>
                <option value="electric">Électrique</option>
                <option value="grass">Plante</option>
                <option value="ice">Glace</option>
                <option value="fighting">Combat</option>
                <option value="poison">Poison</option>
                <option value="ground">Sol</option>
                <option value="flying">Vol</option>
                <option value="psychic">Psy</option>
                <option value="bug">Insecte</option>
                <option value="rock">Roche</option>
                <option value="ghost">Spectre</option>
                <option value="dragon">Dragon</option>
                <option value="dark">Ténèbres</option>
                <option value="steel">Acier</option>
                <option value="fairy">Fée</option>
            </select>
            
            <button id="boutonAfficherEquipe" class="bouton-equipe">
                👥 Mon Équipe (<span id="compteurEquipe">0</span>/6)
            </button>
        </div>

        <!-- Indicateur de chargement -->
        <div id="chargement" class="chargement">
            <div class="spinner"></div>
            <p>Chargement des Pokémon...</p>
        </div>

        <!-- Grille Pokémon -->
        <div id="grillePokemon" class="grille-pokemon"></div>

        <!-- Bouton charger plus -->
        <div class="conteneur-charger-plus">
            <button id="boutonChargerPlus" class="bouton-charger-plus">Charger plus de Pokémon</button>
        </div>
    </div>

    <!-- Modale pour les détails Pokémon -->
    <div id="modale" class="modale">
        <div class="contenu-modale">
            <span class="bouton-fermer">&times;</span>
            <div id="corpsModale" class="corps-modale">
                <!-- Les détails du Pokémon seront insérés ici -->
            </div>
        </div>
    </div>

    <!-- Panneau de l'équipe -->
    <aside id="panneauEquipe" class="panneau-equipe">
        <div class="entete-panneau">
            <h2>Mon Équipe Pokémon</h2>
            <button id="boutonFermerPanneau" class="bouton-fermer-panneau">✕</button>
        </div>
        <div id="conteneurEquipe" class="conteneur-equipe">
            <p class="message-equipe-vide">Aucun Pokémon dans l'équipe</p>
        </div>
    </aside>

    <!-- Overlay pour le panneau -->
    <div id="overlayPanneau" class="overlay-panneau"></div>

    <script src="script.js"></script>
</body>
</html>
